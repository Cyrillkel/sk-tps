server {
    listen 80;
    listen [::]:80;
    server_name 177.203.49.191;

    root /srv/sk-tps/current;
    index index.html;
    server_tokens off;
    expires -1;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        root /srv/sk-tps/shared;
        expires 365d;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }
}
