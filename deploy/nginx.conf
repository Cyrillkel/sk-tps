# Feedback form: a few requests per minute per visitor are enough.
limit_req_zone $binary_remote_addr zone=sk_tps_feedback:1m rate=5r/m;

# Search engines may index the main domain; keep the demo IP closed.
map $host $sk_tps_robots {
    default "noindex, nofollow, noarchive";
    sk-tps.ru "";
    www.sk-tps.ru "";
}

# The domain lives at https://sk-tps.ru: HTTP and www redirect there, except ACME challenges.
# The demo IP stays on plain HTTP; CI checks deployments through it.
map "$scheme://$host$request_uri" $sk_tps_redirect {
    default 0;
    "~^http://(www\.)?sk-tps\.ru/\.well-known/acme-challenge/" 0;
    "~^http://(www\.)?sk-tps\.ru/" 1;
    "~^https://www\.sk-tps\.ru/" 1;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 177.203.49.191 sk-tps.ru www.sk-tps.ru;

    # Issued and renewed by certbot, see deploy/enable-https.sh.
    ssl_certificate /etc/letsencrypt/live/sk-tps.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sk-tps.ru/privkey.pem;
    ssl_session_cache shared:sk_tps_ssl:10m;

    if ($sk_tps_redirect) {
        return 301 https://sk-tps.ru$request_uri;
    }

    root /srv/sk-tps/current;
    index index.html;
    server_tokens off;
    expires -1;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/ld+json
        text/plain
        image/svg+xml
        application/xml;

    add_header X-Robots-Tag $sk_tps_robots always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location /_next/static/ {
        root /srv/sk-tps/shared;
        expires 365d;
        add_header Cache-Control "public, immutable";
        # A location with add_header does not inherit the server's add_header values.
        add_header X-Robots-Tag $sk_tps_robots always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # backend/feedback, installed by deploy/install-feedback.sh.
    location = /api/feedback {
        limit_except POST { deny all; }
        limit_req zone=sk_tps_feedback burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }

    # Keep this after the dotfile rule and limit caching to media, never HTML.
    location ~* ^/(images|documents|brand)/.*\.(avif|gif|ico|jpe?g|png|svg|webp|pdf)$ {
        expires 7d;
        try_files $uri =404;
    }
}
