server {
    listen 80;
    listen [::]:80;
    server_name 177.203.49.191;

    root /srv/sk-tps/current;
    index index.html;
    server_tokens off;
    expires -1;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/ld+json
        text/plain
        image/svg+xml
        application/xml;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        root /srv/sk-tps/shared;
        expires 365d;
        add_header Cache-Control "public, immutable";
        # A location with add_header does not inherit the server's add_header values.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }

    # Keep this after the dotfile rule and limit caching to media, never HTML.
    location ~* ^/(images|documents|brand)/.*\.(avif|gif|ico|jpe?g|png|svg|webp|pdf)$ {
        expires 7d;
        try_files $uri =404;
    }
}
